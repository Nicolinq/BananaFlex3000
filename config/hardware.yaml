      number: 1-0-40
   s_bumper_done:
      number: 1-0-41    
   s_bank4_1:
      number: 1-0-42  
   s_bank4_2:
      number: 1-0-43  
   s_bank4_3:
      number: 1-0-44
   s_bank4_4:
      number: 1-0-45  
   s_left_lane:
      number: 1-0-46  
   s_right_lane:
      number: 1-0-47  
   s_left_orbit:
      number: 1-0-48  
   s_right_orbit:
      number: 1-0-49  
   s_bank3_1:
      number: 1-0-50  
   s_bank3_2:
      number: 1-0-51  
   s_bank3_3:
      number: 1-0-52  
   s_right_mini_target:
      number: 1-0-53  
   s_left_mini_target:
      number: 1-0-54  
   s_spinner:
      number: 1-0-55  
   s_left_inlane:
      number: 1-0-57  
   s_right_inlane:
      number: 1-0-58  
   s_bank3_target:
      number: 1-0-59  
   s_rotation_target:
      number: 1-0-60


    #Playfield Switches (Direct)
   s_left_EOS:
      number: 0-0-1
   s_right_EOS:
      number: 0-0-2
   s_ball_trough_1:
      number: 0-0-8    
   s_ball_trough_2:
      number: 0-0-9   
   s_ball_trough_3:
      number: 0-0-10   
   s_ball_trough_jam:
      number: 0-0-11   
   s_bumper_spe:
      number: 0-0-16 
   s_lock_1:
      number: 0-0-24 
   s_lock_2:
      number: 0-0-25 
   s_lock_3:
      number: 0-0-26 
   s_magnet_1:
      number: 0-0-27 
   s_magnet_2:
      number: 1-0-1 
   s_ramp_begin:
      number: 0-0-3

flippers:
  left_flipper:
        main_coil: c_flipper_left
        activation_switch: s_flipper_left_button
        eos_switch : s_left_EOS
        enable_events: ball_started, enableAutofire
        disable_events: ball_will_end, disableAutofire, shutdown
  right_flipper:
        main_coil: c_flipper_right
        activation_switch: s_flipper_right_button
        eos_switch : s_right_EOS
        enable_events: ball_started, enableAutofire
        disable_events: ball_will_end, disableAutofire, shutdown

autofire_coils:
    pop_bumper:
        coil: c_bump
        switch: s_bumper_done
        enable_events: ball_started, enableAutofire
        disable_events: ball_will_end, disableAutofire, shutdown

diverters:
  lock_diverter:
    activation_coil: c_lock_divertor
    type: hold
    activation_time: 3s
    activation_switches: s_left_orbit
    enable_events: ball_started, enable_lock_diverter
    disable_events: ball_ended, disable_lock_diverter
    targets_when_active: bd_lock
  top_left_gate_diverter:
    activation_coil: c_top_left_gate
    type: hold
    activation_time: 3s
    activation_switches: s_right_orbit
    enable_events: ball_started, enable_top_left_gate_diverter
    disable_events: ball_ended, disable_top_left_gate_diverter
    targets_when_active: playfield

