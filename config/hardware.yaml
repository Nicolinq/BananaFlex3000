#config_version=6

coils:
    c_outhole:
       number: 0-0-1
       default_pulse_ms: 22
       default_pulse_power: 0.55
       default_hold_power: 0.075
    c_flipper_left:
        number: 0-0-14
        #allow_enable: true
        default_hold_power: 0.08
        default_pulse_power: 1.0
        default_pulse_ms: 35
    c_flipper_right:
        number: 0-0-13
        #allow_enable: true
        default_hold_power: 0.08
        default_pulse_power: 1.0
        default_pulse_ms: 35
    c_bump:
       number: 0-0-4
       default_pulse_ms: 22
       default_pulse_power: 0.55
       default_recycle: True
       platform_settings:
            recycle_factor: 1
    c_top_left_gate:
       number: 0-0-5
       default_pulse_ms: 25
       default_hold_power: 0.2   # keep this low 
    c_lock_divertor:
       number: 0-0-6
       default_pulse_ms: 25
       default_hold_power: 0.2   # keep this low 
    c_lock_release:
       number: 0-0-7
       default_pulse_ms: 25
       default_hold_power: 0.2   # keep this low 
    c_left_diverter:
       number: 0-0-8
       default_pulse_ms: 25
       default_hold_power: 0.2   # keep this low 

switches:
    #Cabinet Switches
   s_start_button:
      number: 1-0-32
      tags: start
      ignore_window_ms: 500ms 
   s_flipper_left_button:
      number: 0-0-17
      tags: left_flipper
   s_flipper_right_button:
      number: 0-0-18
      tags: right_flipper
    #Playfield Switches (Matrix)
   s_launch_button:
      number: 1-0-33
   s_setup_button:
      number: 1-0-34
   s_plus_button:
      number: 1-0-35
   s_minus_button:
      number: 1-0-36
   s_enter_button:
      number: 1-0-37
