#config_version=6

mode:
  start_events: start_mode_banana_belt
  stop_events: stop_mode_banana_belt,start_bending_mode
  priority: 200

# modes/banana_belt/config/banana_belt.yaml

shots:
  shot_l_unbended_1:
    switch: s_bank4_1
    show_tokens:
      leds: l_Led_unbended_b_1
    profile: banana_led_profile
  shot_l_unbended_2:
    switch: s_bank4_2
    show_tokens:
      leds: l_Led_unbended_b_2
    profile: banana_led_profile
  shot_l_unbended_3:
    switch: s_bank4_3
    show_tokens:
      leds: l_Led_unbended_b_3
    profile: banana_led_profile
  shot_l_unbended_4:
    switch: s_bank4_4
    show_tokens:
      leds: l_Led_unbended_b_4
    profile: banana_led_profile    
  shot_l_unbended_5:
    show_tokens:
      leds: l_Led_unbended_b_5
    profile: banana_led_profile    
  shot_l_unbended_6:
    show_tokens:
      leds: l_Led_unbended_b_6
    profile: banana_led_profile    
  shot_l_unbended_7:
    show_tokens:
      leds: l_Led_unbended_b_7
    profile: banana_led_profile    
  shot_l_unbended_8:
    show_tokens:
      leds: l_Led_unbended_b_8
    profile: banana_led_profile    
  shot_l_unbended_9:
    show_tokens:
      leds: l_Led_unbended_b_9
    profile: banana_led_profile    
  shot_l_unbended_10:
    show_tokens:
      leds: l_Led_unbended_b_10
    profile: banana_led_profile    
  shot_l_unbended_11:
    show_tokens:
      leds: l_Led_unbended_b_11
    profile: banana_led_profile    
  shot_l_unbended_12:
    switch: s_bank3_1
    show_tokens:
      leds: l_Led_unbended_b_12
    profile: banana_led_profile    
  shot_l_unbended_13:
    switch: s_bank3_2
    show_tokens:
      leds: l_Led_unbended_b_13
    profile: banana_led_profile    
  shot_l_unbended_14:
    switch: s_bank3_3
    show_tokens:
      leds: l_Led_unbended_b_14
    profile: banana_led_profile
  shot_rotate_target:
    switch: s_rotation_target
    profile: rotate_profile
    advance_events: change_banana_belt_count_complete

shot_groups:
  banana_belt_group:
    shots: shot_l_unbended_1,shot_l_unbended_2,shot_l_unbended_3,
           shot_l_unbended_4, shot_l_unbended_5, shot_l_unbended_6, shot_l_unbended_7, shot_l_unbended_8, 
           shot_l_unbended_9, shot_l_unbended_10, shot_l_unbended_11, shot_l_unbended_12, 
           shot_l_unbended_13,shot_l_unbended_14 
    rotate_right_events: shot_rotate_target_rotate_right_hit
    rotate_left_events: shot_rotate_target_rotate_left_hit


shot_profiles:
  banana_led_profile:
    states:
      - name: off
        show: off
      - name: on
        show: led_flash
        show_tokens:
          color: white
  rotate_profile:
    states:
      - name: rotate_right
      - name: rotate_left
    loop: true
    advance_on_hit: false

shows:
  led_flash:
  - time: 0
    lights:
      (leds): (color)
  - time: +.2s
    lights:
      (leds): off
  - time: +.2s
    lights:
      (leds): (color)
  - time: +.2s
    lights:
      (leds): off
  - time: +.2s
    duration: -1
    lights:
      (leds): (color)

counters:
  change_banana_belt: 
    count_events: shot_rotate_target_hit
    starting_count: 0
    count_complete_value: 5
    count_interval: 1
    direction: up
    events_when_complete: change_banana_belt_count_complete
    reset_on_complete: true
    disable_on_complete: false
  banana_belt_count: 
    count_events: banana_belt_group_off_hit
    starting_count: 0
    #count_complete_value: 10
    count_interval: 1
    direction: up
    #events_when_complete: start_bending_mode
    reset_on_complete: true
    disable_on_complete: false


event_player:
  counter_banana_belt_count_hit{device.counters.banana_belt_count.value==10}: toto_event
