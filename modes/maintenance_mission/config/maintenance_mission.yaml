#config_version=6

mode:
  start_events: start_mode_maintenance_mission
  stop_events: stop_mode_maintenance_mission, ball_will_end
  priority: 260

# =====================================================================
# ACHIEVEMENT "maintenance_mission"
#
# Lifecycle:
#   1. Activation (Qualified):
#      - Triggered when a spinner stack is completed (spinner_stack_complete)
#      - LED l_mission_start flashes
#      - Diverter is enabled so orbit shot diverts ball into bd_lock
#
#   2. Mission Start:
#      - Ball enters bd_lock via the orbit
#      - bd_lock ejects ball back to the playfield
#      - 120-second timer begins countdown
#      - Progress starts at 0%
#
#   3. Progression:
#      - Every playfield switch hit adds 1% to pv_maintenance_mission_percent
#
#   4. Completion / Timeout:
#      - Reaching 100% awards 200,000 points and completes the achievement
#      - If 120s expires before 100%, mission times out and resets
# =====================================================================

achievements:
  maintenance_mission:
    enable_events: maintenance_mission_qualify
    start_events: start_maintenance_mission
    complete_events: maintenance_mission_completed

# Playfield switches that contribute to the 1% maintenance_mission progress
shots:
  shot_maintenance_mission_switch:
    switch: s_bank4_1, s_bank4_2, s_bank4_3, s_bank4_4, s_upper_left_lane, s_upper_right_lane, s_left_orbit, s_right_orbit, s_bank3_1, s_bank3_2, s_bank3_3, s_right_target, s_left_target, s_spinner, s_left_inlane, s_right_inlane, s_wall_target, s_bumper_target, s_red_monkey, s_bumper, s_magnet, s_ramp_begin, s_ramp_end
    enable_events: start_maintenance_mission
    disable_events: maintenance_mission_completed, maintenance_mission_timeout, mode_maintenance_mission_will_stop

# Progress counter from 0 to 100%
counters:
  co_maintenance_mission_percent:
    count_events: shot_maintenance_mission_switch_hit
    count_complete_value: pv_maintenance_mission_switchs_to_complete
    starting_count: 0
    direction: up
    persist_state: false
    enable_events: start_maintenance_mission
    disable_events: maintenance_mission_completed, maintenance_mission_timeout, mode_maintenance_mission_will_stop
    reset_events: start_maintenance_mission
    events_when_complete: maintenance_mission_completed

# 120 seconds time limit
timers:
  tim_maintenance_mission_limit:
    start_value: pv_maintenance_mission_initial_time
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: start_maintenance_mission
        action: restart
      - event: maintenance_mission_completed
        action: stop
      - event: maintenance_mission_timeout
        action: stop
      - event: mode_maintenance_mission_will_stop
        action: stop

event_player:
  # Activate mission qualification on spinner stack completion
  spinner_stack_complete{current_player.pv_maintenance_mission_completed==0 and current_player.pv_maintenance_mission_running==0}:
    - maintenance_mission_qualify
    - enable_lock_diverter
    - enable_top_left_gate_diverter

  # If qualified from previous ball, re-enable diverters on mode start
  mode_maintenance_mission_started{current_player.pv_maintenance_mission_ready==1 and current_player.pv_maintenance_mission_completed==0 and current_player.pv_maintenance_mission_running==0}:
    - enable_lock_diverter
    - enable_top_left_gate_diverter

  # Orbit shot routes ball into bd_lock -> mission starts & ball is ejected
  balldevice_bd_lock_ball_entered{current_player.pv_maintenance_mission_ready==1 and current_player.pv_maintenance_mission_running==0}:
    - start_maintenance_mission
    - eject_bd_lock|1s

  # Time limit expired (120s)
  timer_tim_maintenance_mission_limit_complete:
    - maintenance_mission_timeout

variable_player:
  maintenance_mission_qualify:
    pv_maintenance_mission_ready:
      int: 1
      action: set

  start_maintenance_mission:
    pv_maintenance_mission_ready:
      int: 0
      action: set
    pv_maintenance_mission_running:
      int: 1
      action: set
    pv_maintenance_mission_percent:
      int: 0
      action: set

  shot_maintenance_mission_switch_hit:
    pv_maintenance_mission_percent: 100/pv_maintenance_mission_switchs_to_complete

  timer_tim_maintenance_mission_limit_tick:
    pv_maintenance_mission_time_remaining:
      int: device.timers.tim_maintenance_mission_limit.ticks
      action: set

  maintenance_mission_completed:
    score: 200000
    pv_maintenance_mission_completed:
      int: 1
      action: set
    pv_maintenance_mission_running:
      int: 0
      action: set
    pv_maintenance_mission_percent:
      int: 100
      action: set

  maintenance_mission_timeout:
    pv_maintenance_mission_running:
      int: 0
      action: set
    pv_maintenance_mission_percent:
      int: 0
      action: set

  mode_maintenance_mission_will_stop:
    pv_maintenance_mission_running:
      int: 0
      action: set

show_player:
  # Qualification: l_mission_start flashes
  maintenance_mission_qualify:
    sh_mission_flash:
      action: play
      loops: -1
      show_tokens:
        leds: l_mission_start
        color: tt_orange

  mode_maintenance_mission_started{current_player.pv_maintenance_mission_ready==1 and current_player.pv_maintenance_mission_completed==0 and current_player.pv_maintenance_mission_running==0}:
    sh_mission_flash:
      action: play
      loops: -1
      show_tokens:
        leds: l_mission_start
        color: tt_orange

  # Mission running: fast flash
  start_maintenance_mission:
    sh_mission_flash:
      action: stop
    sh_mission_running:
      action: play
      loops: -1
      show_tokens:
        leds: l_mission_start
        color: tt_yellow

  # Completed: stop running show, illuminate solid green
  maintenance_mission_completed:
    sh_mission_running:
      action: stop
    sh_mission_completed:
      action: play
      show_tokens:
        leds: l_mission_start
        color: tt_green

  mode_maintenance_mission_started{current_player.pv_maintenance_mission_completed==1}:
    sh_mission_completed:
      action: play
      show_tokens:
        leds: l_mission_start
        color: tt_green

  maintenance_mission_timeout:
    sh_mission_running:
      action: stop

  mode_maintenance_mission_will_stop:
    sh_mission_flash:
      action: stop
    sh_mission_running:
      action: stop
    sh_mission_completed:
      action: stop

light_player:
  maintenance_mission_timeout:
    l_mission_start: off
  mode_maintenance_mission_will_stop:
    l_mission_start: off

shows:
  sh_mission_flash:
    - time: 0
      lights:
        (leds): (color)
    - time: +.25s
      lights:
        (leds): off
    - time: +.25s
      lights:
        (leds): (color)
    - time: +.25s
      lights:
        (leds): off

  sh_mission_running:
    - time: 0
      lights:
        (leds): (color)
    - time: +.12s
      lights:
        (leds): off
    - time: +.12s
      lights:
        (leds): (color)
    - time: +.12s
      lights:
        (leds): off

  sh_mission_completed:
    - time: 0
      duration: -1
      lights:
        (leds): (color)

