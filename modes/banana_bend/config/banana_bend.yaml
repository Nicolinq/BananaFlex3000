#config_version=6

mode:
  start_events: start_mode_banana_bend
  stop_events: stop_mode_banana_bend
  priority: 200

# modes/banana_belt/config/banana_bend.yaml

shots:
  shot_l_bend_start:
    show_tokens:
      leds: l_bend_bananas_start
    profile: sp_banana_bend_profile_flash
    hit_events: mode_banana_bend_started
    disable_events: bend_bananas_completed, mode_banana_bend_will_stop
  shot_l_bend_arrow_start:
    show_tokens:
      leds: l_arrow_top_right
    profile: sp_banana_bend_profile_flash
    hit_events: mode_banana_bend_started
    disable_events: bend_bananas_completed, mode_banana_bend_will_stop
  shot_l_bend_mode_start:
    show_tokens:
        leds: l_bend_state
    profile: sp_banana_bend_profile_on
    hit_events: mode_banana_bend_started
    disable_events: bend_bananas_completed, mode_banana_bend_will_stop
  shot_l_bend_mode_completed:
    show_tokens:
        leds: l_bend_state
    profile: sp_banana_bend_profile_flash
    hit_events: bend_bananas_completed
    disable_events: mode_banana_bend_will_stop
  
shot_profiles:
  sp_banana_bend_profile_flash:
    states:
      - name: off
        show: off
      - name: on
        show: sh_led_flash
        show_tokens:
          color: white
  sp_banana_bend_profile_on:
    states:
      - name: off
        show: off
      - name: on
        show: sh_insert_on
        show_tokens:
          color: tt_red


event_player:
  mode_banana_bend_started: enable_lock_diverter,enable_top_left_gate_diverter
  balldevice_bd_lock_ball_entered: bend_bananas_completed

variable_player:
  bend_bananas_completed:
    score: 100000 * current_player.pv_playfield_multiplier