  shot_l_bend_start:
    show_tokens:
      leds: l_bend_bananas_start
    profile: sp_banana_bend_profile_flash
    hit_events: mode_banana_bend_started
    disable_events: bend_bananas_completed, mode_banana_bend_will_stop
  shot_l_bend_arrow_start:
    show_tokens:
      leds: l_arrow_top_right
    profile: sp_banana_bend_profile_flash
    hit_events: mode_banana_bend_started
    disable_events: bend_bananas_completed, mode_banana_bend_will_stop
  shot_l_bend_mode_start:
    show_tokens:
        leds: l_bend_state
    profile: sp_banana_bend_profile_on
    hit_events: mode_banana_bend_started
    disable_events: bend_bananas_completed, mode_banana_bend_will_stop
  shot_l_bend_mode_completed:
    show_tokens:
        leds: l_bend_state
    profile: sp_banana_bend_profile_flash
    hit_events: bend_bananas_completed
    disable_events: mode_banana_bend_will_stop
  
shot_profiles:
  sp_banana_bend_profile_flash:
    states:
      - name: off
        show: off
      - name: on
        show: sh_led_flash
        show_tokens:
          color: white
  sp_banana_bend_profile_on:
    states:
      - name: off
        show: off
      - name: on
        show: sh_insert_on
        show_tokens:
          color: tt_red
  sp_banana_wrong_control_profile:
    states:
      - name: off
        show: off
      - name: on
        show: sh_hit_flash
        show_tokens:
          color: tt_red

# when bending : 1 on 10 will not pass control
random_event_player:
    # mettre des events avec des conditions, la condition étant que la led est allumée
    # faire 5 blocs de 10 pour que max 5 bananes ne passent pas le controle
  choose_wrong_bananas_1_10:
