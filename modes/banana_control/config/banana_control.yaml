    profile: sp_banana_control_profile_on
    hit_events: mode_banana_control_started
    disable_events: control_bananas_completed, mode_banana_control_will_stop

shot_profiles:
  sp_banana_control_profile:
    block: true
    loop: false
    advance_on_hit: false
    states:
      - name: off
        show: off
      - name: control_ok
        show: sh_hit_flash
        show_tokens:
          color: tt_green
      - name: control_nok
        show: sh_hit_flash
        show_tokens:
          color: tt_red
  sp_banana_control_profile_on:
    states:
      - name: off
        show: off
      - name: on
        show: sh_insert_on
        show_tokens:
          color: tt_red



