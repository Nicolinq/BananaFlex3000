           shot_l_unbended_43,shot_l_unbended_44,shot_l_unbended_45,shot_l_unbended_46,shot_l_unbended_47,
           shot_l_unbended_48,shot_l_unbended_49,shot_l_unbended_50
    rotate_right_events: shot_load_rotate_target_rotate_right_hit
    rotate_left_events: shot_load_rotate_target_rotate_left_hit
    reset_events: reset_banana_belt

shot_profiles:
  sp_banana_load_profile_hit:
    states:
      - name: off
        show: off
      - name: on
        show: sh_hit_flash
        show_tokens:
          color: tt_yellow
    loop: false
    advance_on_hit: true
  sp_banana_load_profile_on:
    states:
      - name: off
        show: off
      - name: on
        show: sh_insert_on
        show_tokens:
          color: tt_red
  sp_load_rotate_profile:
    states:
      - name: rotate_right
      - name: rotate_left
    loop: true
    advance_on_hit: false


counters:
  co_change_banana_belt_direction: 
    count_events: shot_load_rotate_target_hit
    starting_count: 0
    # Permet d'inverser le sens de rotation si nécessaire. Valeur à 10000 pour désactiver
    count_complete_value: 10000
    count_interval: 1
    direction: up
    events_when_complete: co_change_banana_belt_direction_count_complete
    reset_on_complete: true
    disable_on_complete: false
    persist_state: true
  co_banana_load_count: 
    count_events: sg_banana_load_group_off_hit
    starting_count: 0
    count_complete_value: current_player.pv_unbended_bananas_to_complete
    count_interval: 1
    direction: up
    events_when_complete: start_mode_banana_bend
    reset_on_complete: false
    disable_on_complete: false
    persist_state: true
    reset_events: reset_banana_belt


event_player:
  mode_banana_load_started{device.counters.co_banana_load_count.value>=current_player.pv_unbended_bananas_to_complete}: start_mode_banana_bend
  mode_banana_load_started: disable_lock_diverter, disable_top_left_gate_diverter
  
  # match between switches and targets
  s_bank4_1_active: advance_load_1
  s_bank4_2_active: advance_load_2
  s_bank4_3_active: advance_load_3
  s_bank4_4_active: advance_load_4
  s_bank3_1_active: advance_load_12
  s_bank3_2_active: advance_load_13
  s_bank3_3_active: advance_load_14


variable_player:
  mode_banana_load_started:
    pv_unbended_bananas_count:
      int: device.counters.co_banana_load_count.value * 1
      action: set
  logicblock_co_banana_load_count_updated:
    pv_unbended_bananas_count:
      int: device.counters.co_banana_load_count.value * 1
      action: set