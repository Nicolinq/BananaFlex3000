#config_version=6

mode:
  start_events: start_mode_banana_load
  stop_events: stop_mode_banana_load,start_mode_banana_bend
  priority: 200

# modes/banana_belt/config/banana_belt.yaml

shots:
  shot_l_load_mode_start:
    show_tokens:
        leds: l_led_load_state
    profile: banana_load_profile_on
    hit_events: mode_banana_belt_started

shot_profiles:
  banana_load_profile_on:
    states:
      - name: off
        show: off
      - name: on
        show: insert_on
        show_tokens:
          color: tt_red

event_player:
  counter_banana_belt_count_hit{device.counters.banana_belt_count.value>=current_player.unbended_bananas_to_complete}: start_mode_banana_bend