#config_version=6
mode:
    start_events: launch_ball_save, ball_started
    stop_events: stop_ball_save # pas utilisé
    priority: 5700

ball_saves:
  saveball:
    auto_launch: true
    active_time: current_player.pv_ball_save_time # 7s
    hurry_up_time: 4s
    grace_period: 3s
    enable_events: mode_base_started
    timer_start_events: balldevice_bd_trough_ball_eject_success
    balls_to_save: 1 # -1 for unlimited

show_player:
  ball_save_saveball_timer_start:
    flash_color:
      key: ball_save
      speed: 2
      show_tokens:
        lights: l_bend_again
        color: orange
  # 3s from end
  ball_save_saveball_hurry_up:
    flash_color:
      key: ball_save
      speed: 6
      show_tokens:
        lights: l_bend_again
        color: orange
  ball_save_saveball_grace_period:
    ball_save: stop
  ball_save_saveball_disabled:
    ball_save: stop

widget_player:
  ball_save_saveball_saving_ball:
    ball_save_widget:
      slide: base_slide
      expire: 2s
