#config_version=6

mode:
  start_events: balldevice_playfield_ball_enter
  stop_events: skill_shot_awarded, skill_shot_missed, ball_will_end
  priority: 500

# =====================================================================
# Skill shot option A is the normal skill shot, with the upper lanes
# Skill shot option B is the super skill shot, activated by the left flipper
# and will consist in hitting the target banks.
# =====================================================================

shots:
  # ---- OPTION A — upper lanes ----
  shot_skill_upper_left_lane:
    switch: s_upper_left_lane
    profile: sp_skill_shot_profile
    show_tokens:
      leds: l_upper_left_lane
      color: tt_yellow
    advance_events: advance_shot_skill_upper_left_lane
    enable_events: mode_skill_shot_started
    disable_events: skill_shot_awarded, skill_shot_missed, ball_will_end
    reset_events: mode_skill_shot_will_stop

  shot_skill_upper_right_lane:
    switch: s_upper_right_lane
    profile: sp_skill_shot_profile
    show_tokens:
      leds: l_upper_right_lane
      color: tt_yellow
    advance_events: advance_shot_skill_upper_right_lane
    enable_events: mode_skill_shot_started
    disable_events: skill_shot_awarded, skill_shot_missed, ball_will_end
    reset_events: mode_skill_shot_will_stop

  # ---- OPTION B — bank4 arrows and bank3 arrows----
  shot_skill_bank4_1:
    switch: s_bank4_1
    profile: sp_skill_bank
    show_tokens:
      leds: l_bank4_1_arrow
      color: tt_yellow
    advance_events: advance_shot_skill_bank4_1
    enable_events: mode_skill_shot_started
    disable_events: skill_shot_awarded, skill_shot_missed, ball_will_end
    reset_events: mode_skill_shot_will_stop

  shot_skill_bank4_2:
    switch: s_bank4_2
    profile: sp_skill_bank
    show_tokens:
      leds: l_bank4_2_arrow
      color: tt_yellow
    advance_events: advance_shot_skill_bank4_2
    enable_events: mode_skill_shot_started
    disable_events: skill_shot_awarded, skill_shot_missed, ball_will_end
    reset_events: mode_skill_shot_will_stop

  shot_skill_bank4_3:
    switch: s_bank4_3
    profile: sp_skill_bank
    show_tokens:
      leds: l_bank4_3_arrow
      color: tt_yellow
    advance_events: advance_shot_skill_bank4_3
    enable_events: mode_skill_shot_started
    disable_events: skill_shot_awarded, skill_shot_missed, ball_will_end
    reset_events: mode_skill_shot_will_stop

  shot_skill_bank4_4:
    switch: s_bank4_4
    profile: sp_skill_bank
    show_tokens:
      leds: l_bank4_4_arrow
      color: tt_yellow
    advance_events: advance_shot_skill_bank4_4
    enable_events: mode_skill_shot_started
    disable_events: skill_shot_awarded, skill_shot_missed, ball_will_end
    reset_events: mode_skill_shot_will_stop

  shot_skill_bank3_1:
    switch: s_bank3_1
    profile: sp_skill_bank
    show_tokens:
      leds: l_bank3_1_arrow
      color: tt_yellow
    advance_events: advance_shot_skill_bank3_1
    enable_events: mode_skill_shot_started
    disable_events: skill_shot_awarded, skill_shot_missed, ball_will_end
    reset_events: mode_skill_shot_will_stop

  shot_skill_bank3_2:
    switch: s_bank3_2
    profile: sp_skill_bank
    show_tokens:
      leds: l_bank3_2_arrow
      color: tt_yellow
    advance_events: advance_shot_skill_bank3_2
    enable_events: mode_skill_shot_started
    disable_events: skill_shot_awarded, skill_shot_missed, ball_will_end
    reset_events: mode_skill_shot_will_stop

  shot_skill_bank3_3:
    switch: s_bank3_3
    profile: sp_skill_bank
    show_tokens:
      leds: l_bank3_3_arrow
      color: tt_yellow
    advance_events: advance_shot_skill_bank3_3
    enable_events: mode_skill_shot_started
    disable_events: skill_shot_awarded, skill_shot_missed, ball_will_end
    reset_events: mode_skill_shot_will_stop

shot_groups:
  # Option A: flipper buttons rotate the flashing state between lanes
  sg_skill_upper_lanes:
    shots: shot_skill_upper_left_lane, shot_skill_upper_right_lane
    rotate_left_events: s_flipper_left_button_active
    rotate_right_events: s_flipper_right_button_active
    enable_events: skill_shot_option_a_ready
    disable_events: skill_shot_awarded, skill_shot_missed, ball_will_end
    reset_events: mode_skill_shot_will_stop

  # Option B: groups bank4 shots so the group-level flashing_hit event fires
  sg_skill_bank4:
    shots: shot_skill_bank4_1, shot_skill_bank4_2, shot_skill_bank4_3, shot_skill_bank4_4, shot_skill_bank3_1, shot_skill_bank3_2, shot_skill_bank3_3
    rotate_events: timer_tim_target_rotator_tick
    enable_events: skill_shot_option_b_ready
    disable_events: skill_shot_awarded, skill_shot_missed, ball_will_end
    reset_events: mode_skill_shot_will_stop

shot_profiles:
  sp_skill_shot_profile:
    advance_on_hit: true   # hit posts the event only; state stays until we advance
    states:
      - name: unlit
        show: off
      - name: flashing
        show: sh_led_flash
  sp_skill_bank:
    rotation_pattern: r, r, r, r, r, r, r, l, l, l, l, l, l, l
    states:
    - name: unlit
      show: off
    - name: flashing
      show: sh_led_flash

# =====================================================================
# Event flow:
#   mode_skill_shot_started
#     - shots enabled (above)
#     - event_player: check flipper state → post skill_shot_option_A/B_start
#   skill_shot_option_a_start
#     - random_event_player: advance one lane to flashing
#     - event_player: enable sg_skill_upper_lanes (posted as option_a_ready)
#   skill_shot_option_b_start → same pattern
# =====================================================================

event_player:
  # Step 1: shots are already enabled.
  mode_skill_shot_started{device.switches.s_flipper_left_button.state==0}:
    - skill_shot_option_a_start

  mode_skill_shot_started{device.switches.s_flipper_left_button.state==1}:
    - skill_shot_option_b_start
    - enable_top_left_gate_diverter

  # Step 2: after random_event_player has advanced the chosen shot,
  # signal that the option is fully ready (enables the shot group).
  skill_shot_option_a_start:
    - skill_shot_option_a_ready

  skill_shot_option_b_start:
    - skill_shot_option_b_ready

  # Award → stop the mode
  sg_skill_upper_lanes_flashing_hit:
    - skill_shot_awarded
  sg_skill_upper_lanes_unlit_hit:
    - skill_shot_missed
  sg_skill_bank4_flashing_hit:
    - skill_shot_awarded
  sg_skill_bank4_unlit_hit:
    - skill_shot_missed
  # Miss in BOTH options
  s_left_target_active:
    - skill_shot_missed
  s_right_target_active:
    - skill_shot_missed
  s_spinner_active:
    - skill_shot_missed
  s_wall_target_active:
    - skill_shot_missed
  s_bumper_active:
    - skill_shot_missed
  s_red_monkey_active:
    - skill_shot_missed
  s_right_inlane_active:
    - skill_shot_missed

# =====================================================================
# Random selection: advance one shot to flashing state.
# Fires after mode_skill_shot_started, shots are already enabled.
# =====================================================================

random_event_player:
  skill_shot_option_a_start:
    force_all: false
    force_different: false
    events:
      - advance_shot_skill_upper_left_lane
      - advance_shot_skill_upper_right_lane

  skill_shot_option_b_start:
    force_all: false
    force_different: false
    events:
      - advance_shot_skill_bank4_1
      # Allows to begin randomly
      # - advance_shot_skill_bank4_2
      # - advance_shot_skill_bank4_3
      # - advance_shot_skill_bank4_4
      # - advance_shot_skill_bank3_1
      # - advance_shot_skill_bank3_2
      # - advance_shot_skill_bank3_3

# =====================================================================
# Timers to rotate
# =====================================================================
timers:
  tim_target_rotator:
    start_running: true
    tick_interval: 1s

# =====================================================================
# Scoring
# =====================================================================

variable_player:
  sg_skill_upper_lanes_flashing_hit:
    score: 100000

  sg_skill_bank4_flashing_hit:
    score: 200000