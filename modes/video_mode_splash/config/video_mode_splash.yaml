#config_version=6

mode:
  start_events: start_mode_video_mode_splash
  stop_events: stop_mode_video_mode_splash, ball_will_end
  priority: 3000
  code: video_mode_splash.VideoModeSplash

# =====================================================================
# VIDEO MODE SPLASH
#
# A video game played on the 50 LEDs of the banana conveyor.
# 2 brown bars grow from each side (outdated bananas).
# Player controls 3 red LEDs in the center with flipper buttons.
# Player hits launch button to splash outdated bananas when touching them.
# Growth speeds up after 4 splashes, and again after 6 splashes.
# 10 splashes => WIN (video_mode_splash_mission_completed + eject_bd_lock)
# Bars touch => LOSE (video_mode_splash_mission_failed + eject_bd_lock)
# =====================================================================

achievements:
  video_mode_splash:
    enable_events: start_video_mode_splash_mission
    start_events: start_video_mode_splash_mission
    complete_events: video_mode_splash_mission_completed
    reset_events: video_mode_splash_mission_failed

slide_player:
  mode_video_mode_splash_started:
    video_mode_splash:
      action: play
  mode_video_mode_splash_will_stop:
    video_mode_splash:
      action: remove

event_player:
  # Disable flipper coils while playing the video game on the conveyor
  mode_video_mode_splash_started:
    - disableAutofire
  # Re-enable flippers when video mode finishes
  mode_video_mode_splash_will_stop:
    - enableAutofire

variable_player:
  video_mode_splash_hit:
    score:
      int: 10000
      action: add
  video_mode_splash_mission_completed:
    score:
      int: 200000
      action: add