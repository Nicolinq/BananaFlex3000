#config_version=6

mode:
  start_events: start_mode_mission_manager
  stop_events: carousel_item_selected, ball_will_end
  priority: 200
  code: mpf.modes.carousel.code.carousel.Carousel

# =====================================================================
# MISSION MANAGER (MPF CAROUSEL MODE)
#
# This mode is a native MPF Carousel — it must NOT start at ball start.
# It is triggered from base.yaml when the ball enters bd_lock while
# missions are qualified (spinner_stack_complete has fired and no mission
# is currently running).
#
# The MPFCarousel node in mission_manager.tscn listens to
# carousel_item_highlighted events and shows/hides child nodes whose
# names match the selectable_items below.
#
# Child nodes in mission_manager.tscn:
#   - maintenance_mission   (shown when highlighted)
#   - shipping_mission      (shown when highlighted)
# =====================================================================

mode_settings:
  selectable_items:
    - maintenance_mission{device.achievements.maintenance_mission.state != 'completed'}
    - shipping_mission{device.achievements.shipping_mission.state != 'completed'}
  next_item_events: s_flipper_right_button_active
  previous_item_events: s_flipper_left_button_active
  select_item_events: s_launch_button_active

slide_player:
  mode_mission_manager_started:
    mission_manager:
      action: play
  mode_mission_manager_will_stop:
    mission_manager:
      action: remove

event_player:
  carousel_item_selected{item=="maintenance_mission"}:
    - start_maintenance_mission
    - eject_bd_lock|1s
  carousel_item_selected{item=="shipping_mission"}:
    - start_shipping_mission
    - eject_bd_lock|1s

show_player:
  mode_mission_manager_will_stop:
    sh_led_flash:
      action: stop
