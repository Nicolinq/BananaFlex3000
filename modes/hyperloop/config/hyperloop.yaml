#config_version=6

mode:
  start_events: start_mode_hyperloop
  stop_events: stop_mode_hyperloop
  priority: 300

shots:
  shot_control_hyperloop:
    show_tokens:
      leds: l_hyperloop_start
    profile: sp_hyperloop_profile_flash
    hit_events: mode_hyperloop_started

shot_profiles:
  sp_hyperloop_profile_flash:
    states:
      - name: off
        show: off
      - name: on
        show: sh_led_flash
        show_tokens:
          color: tt_yellow
    loop: false
    advance_on_hit: true
  
show_player:
  mode_hyperloop_started:
    hyperloop_rainbow:
      speed: 50