#config_version=6

mode:
  start_events: start_mode_classic_multiball
  stop_events: ball_will_end
  priority: 3000

# =====================================================================
# CLASSIC MULTIBALL — lock 3 balls to start
#
# Flow:
#   sequential_targets_done
#     - multiball_lock enabled for ONE ball (except first instance)
#     - l_lock_start flashes orange
#   Ball enters bd_lock → multiball_lock_classic_mb_lock_locked_ball fires
#     - sequential targets reset (player must do the sequence again)
#     - l_lock_start lights red (steady) to show one ball is locked
#   When 3rd ball locked → multiball_lock_classic_mb_lock_full fires
#     - start_classic_multiball -> multiball device kicks off the MB
# =====================================================================

achievements:
  classic_multiball_jackpot:
    enable_events: start_classic_multiball
    start_events: start_classic_multiball
    complete_events: classic_multiball_jackpot_done
    restart_after_stop_possible: false

multiballs:
  mb_classic_multiball:
    ball_count: 3
    ball_count_type: add
    start_events: start_classic_multiball
    ball_locks: bd_lock


multiball_locks:
  ml_classic_mb_lock:
    lock_devices: bd_lock
    balls_to_lock: 3
    balls_to_replace: 2
    # Enabled one at a time, after each sequential_targets completion.
    # Disables itself as soon as one ball is accepted, so the player
    # must re-complete the sequence to enable the next lock slot.
    enable_events: sequential_targets_done
    disable_events: mode_hyperloop_started, multiball_lock_ml_classic_mb_lock_locked_ball{current_player.pv_classic_multiball_instance>0}, ball_will_end
    locked_ball_counting_strategy: virtual_only
    reset_count_for_current_player_events: multiball_lock_ml_classic_mb_lock_full

# Jackpots
shots:
  shot_l_ramp_jackpot_start:
    show_tokens:
      leds: l_ramp_jackpot, l_ramp_arrow
    profile: sp_classic_multiball_profile_flash
    hit_events: start_classic_multiball, ramp_shot_done
    disable_events: multiball_mb_classic_multiball_ended, ball_will_end

shot_profiles:
  sp_classic_multiball_profile_flash:
    states:
      - name: off
        show: off
      - name: on
        show: sh_led_flash
        show_tokens:
          color: red
      - name: done
        show: sh_insert_on
        show_tokens:
          color: green

event_player:
  # Jackpot
  shot_l_ramp_jackpot_start_on_hit: classic_multiball_jackpot_done

  # 3rd ball locked → lock is full -> start multiball
  multiball_lock_ml_classic_mb_lock_full:
    - disable_shot_sequence
    - start_classic_multiball

  # after loss => restart shot_sequence
  multiball_mb_classic_multiball_ended:
    - reset_shot_sequence
    - enable_shot_sequence

  # After each ball is locked, reset the sequential shot sequence after instance 1
  multiball_lock_ml_classic_mb_lock_locked_ball{current_player.pv_classic_multiball_instance==0}:
    - disable_shot_sequence


  multiball_lock_ml_classic_mb_lock_locked_ball{current_player.pv_classic_multiball_instance>0}:
    - reset_shot_sequence
    - enable_shot_sequence
  
  # open diverters
  sequential_targets_done:
    - enable_lock_diverter
    - enable_top_left_gate_diverter

variable_player:
  #Jackpot
  classic_multiball_jackpot_done:
    score: 100000

  #Increase the instance when completed.
  #First multiball is easy
  multiball_mb_classic_multiball_started:
    pv_classic_multiball_instance: 1
    
# =====================================================================
# Light: flash l_lock_start while lock is available;
#        light steady red once a ball is locked.
# =====================================================================
show_player:
  # Lock available → flash orange
  sequential_targets_done:
    sh_led_flash:
      action: play
      loops: -1
      show_tokens:
        leds: l_lock_start, l_arrow_top_right
        color: tt_orange

  # Ball locked → stop flash, light red steady
  multiball_lock_ml_classic_mb_lock_locked_ball{current_player.pv_classic_multiball_instance>0}:
    sh_led_flash:
      action: stop

  # Mode stopping → clear the light
  mode_classic_multiball_will_stop:
    sh_led_flash:
      action: stop

  # Mode starting → clear the light
  multiball_mb_classic_multiball_started:
    sh_led_flash:
      action: stop

