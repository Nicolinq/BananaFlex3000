#config_version=6

mode:
  start_events: ball_started
  stop_events: ball_will_end
  priority: 100

event_player:
   mode_base_started:
      - start_mode_bumper
      - start_mode_slingshot
      - start_mode_banana_belt
      - start_mode_banana_load
   mode_base_will_stop:
      - stop_mode_bumper
      - stop_mode_slingshot
      - stop_mode_banana_belt
      - stop_mode_banana_load
      - stop_mode_banana_bend

slide_player:
   mode_base_started: base_slide

shots:
  shot_service:
    switch: s_setup_button, s_plus_button, s_minus_button, s_enter_button
  shot_left_bank:
    switch: s_bank4_1, s_bank4_2, s_bank4_3, s_bank4_4
  shot_right_bank:
    switch: s_bank3_1, s_bank3_2, s_bank3_3
  shot_top_lanes:
    switch: s_left_lane, s_right_lane
  shot_orbits:
    switch: s_left_orbit, s_right_orbit
  shot_mini_targets:
    switch: s_right_mini_target, s_left_mini_target
   
shows:
  led_flash:
  - time: 0
    lights:
      (leds): (color)
  - time: +.3s
    lights:
      (leds): off
  hit_flash:
  - time: 0
    lights:
      (leds): (color)
  - time: +.2s
    lights:
      (leds): off
  - time: +.2s
    lights:
      (leds): (color)
  - time: +.2s
    lights:
      (leds): off
  - time: +.2s
    duration: -1
    lights:
      (leds): (color)
  insert_on:
  - time: 0
    duration: -1
    lights:
      (leds): (color)

variable_player:
  shot_left_bank_hit:
    score: 2000 * current_player.playfield_multiplier
  shot_right_bank_hit:
    score: 2000 * current_player.playfield_multiplier
  shot_top_lanes_hit:
    score: 1500 * current_player.playfield_multiplier
  shot_orbits_hit:
    score: 1500 * current_player.playfield_multiplier
  shot_mini_targets_hit:
    score: 1500 * current_player.playfield_multiplier