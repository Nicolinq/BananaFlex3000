#config_version=6

config:
- upper_lanes.yaml

mode:
  start_events: ball_started
  stop_events: ball_will_end
  priority: 100

event_player:
   mode_base_started:
      - start_mode_bumper
      - start_mode_banana_belt
      - start_mode_banana_load
      - start_mode_spinner
   mode_base_will_stop:
      - stop_mode_bumper
      - stop_mode_banana_belt
      - stop_mode_banana_load
      - stop_mode_banana_bend
      - stop_mode_spinner

slide_player:
   mode_base_started: base_slide

shots:
  shot_service:
    switch: s_setup_button, s_plus_button, s_minus_button, s_enter_button
  shot_left_bank:
    switch: s_bank4_1, s_bank4_2, s_bank4_3, s_bank4_4
  shot_right_bank:
    switch: s_bank3_1, s_bank3_2, s_bank3_3
  shot_orbits:
    switch: s_left_orbit, s_right_orbit
  shot_bottom_targets:
    switch: s_right_target, s_left_target
  shot_magnet:
      switches: s_magnet



shows:
  sh_led_flash:
  - time: 0
    lights:
      (leds): (color)
  - time: +.5s
    lights:
      (leds): off
  sh_hit_flash:
  - time: 0
    lights:
      (leds): (color)
  - time: +.2s
    lights:
      (leds): off
  - time: +.2s
    lights:
      (leds): (color)
  - time: +.2s
    lights:
      (leds): off
  - time: +.2s
    duration: -1
    lights:
      (leds): (color)
  sh_insert_on:
  - time: 0
    duration: -1
    lights:
      (leds): (color)

variable_player:
  shot_left_bank_hit:
    score: 2000 * current_player.bonus_multiplier
  shot_right_bank_hit:
    score: 2000 * current_player.bonus_multiplier
  shot_orbits_hit:
    score: 1500 * current_player.bonus_multiplier
  shot_mini_targets_hit:
    score: 1500 * current_player.bonus_multiplier


coil_player:
  shot_magnet_hit: c_magnet