#config_version=6

config:
- upper_lanes.yaml
- orbits.yaml
- ramp.yaml

mode:
  start_events: ball_started
  stop_events: ball_will_end
  priority: 100

event_player:
   mode_base_started:
      - start_mode_bumper
      - start_mode_banana_load
      - start_mode_spinner
      - start_mode_skill_shot
      - start_mode_maintenance_mission
      - start_mode_mission_manager
      - start_mode_shipping_mission
   mode_base_will_stop:
      - stop_mode_bumper
      - stop_mode_banana_load
      - stop_mode_banana_bend
      - stop_mode_banana_control
      - stop_mode_spinner
      - stop_mode_sequential_targets
      - stop_mode_classic_multiball
      - stop_mode_maintenance_mission
      - stop_mode_mission_manager
      - stop_mode_shipping_mission
      - stop_mode_hyperloop
   mode_skill_shot_will_stop:
      - start_mode_sequential_targets
      - start_mode_classic_multiball

slide_player:
   mode_base_started: base_slide

shots:
  shot_service:
    switch: s_setup_button, s_plus_button, s_minus_button, s_enter_button
  shot_left_bank:
    switch: s_bank4_1, s_bank4_2, s_bank4_3, s_bank4_4
  shot_right_bank:
    switch: s_bank3_1, s_bank3_2, s_bank3_3
  shot_bottom_targets:
    switch: s_right_target, s_left_target
  shot_magnet:
      switches: s_magnet
  shot_top_lanes:
    switch: s_upper_left_lane, s_upper_right_lane
  shot_launch_button:
    switch: s_launch_button

shows:
  sh_led_flash:
  - time: 0
    lights:
      (leds): (color)
  - time: +.5s
    lights:
      (leds): off
  sh_hit_flash:
  - time: 0
    lights:
      (leds): (color)
  - time: +.2s
    lights:
      (leds): off
  - time: +.2s
    lights:
      (leds): (color)
  - time: +.2s
    lights:
      (leds): off
  - time: +.2s
    duration: -1
    lights:
      (leds): (color)
  sh_insert_on:
  - time: 0
    duration: -1
    lights:
      (leds): (color)
  sh_mission_running:
    - time: 0
      lights:
        (leds): (color)
    - time: +.12s
      lights:
        (leds): off
    - time: +.12s
      lights:
        (leds): (color)
    - time: +.12s
      lights:
        (leds): off

variable_player:
  shot_left_bank_hit:
    score: 2000 * current_player.bonus_multiplier
    base_bonus: 1_000
  shot_right_bank_hit:
    score: 2000 * current_player.bonus_multiplier
    base_bonus: 1_000
  shot_mini_targets_hit:
    score: 1500 * current_player.bonus_multiplier
    base_bonus: 1_000
  shot_top_lanes_hit:
    score: 1000 * current_player.bonus_multiplier
    base_bonus: 1_000

coil_player:
  shot_magnet_hit: c_magnet

achievement_groups:
  mission_awards:
    achievements:
      - maintenance_mission
      - shipping_mission
    auto_select: true
    events_when_all_completed: all_missions_completed
    enable_while_no_achievement_started: false
    show_when_enabled: on
    allow_selection_change_while_disabled: true
    disable_while_achievement_started: false
    #start_selected_events: balldevice_electric_chair_ball_enter, balldevice_swamp_kickout_ball_enter, award_mansion_from_bear
    #enable_events: light_chair
    #disable_events: unlight_chair