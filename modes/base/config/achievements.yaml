#config_version=6


#Achievements management
achievement_groups:
  mission_awards:
    achievements:
      - maintenance_mission
      - shipping_mission
      - hyperloop
      - classic_multiball_jackpot
      - video_mode_splash
    events_when_all_completed: all_missions_completed

# Display achievements
# Update
slide_player:
  achievement_hyperloop_changed_state:
    base_slide:
      action: update
  achievement_maintenance_mission_changed_state:
    base_slide:
      action: update
  achievement_shipping_mission_changed_state:
    base_slide:
      action: update
  achievement_classic_multiball_jackpot_changed_state:
    base_slide:
      action: update
  achievement_video_mode_splash_changed_state:
    base_slide:
      action: update


# Relay the achievements status to the variable players for Godot
variable_player:
  achievement_hyperloop_changed_state:
    pv_hyperloop_status:
      string: "{state}"
      action: set
  achievement_maintenance_mission_changed_state:
    pv_mission_maintenance_status:
      string: "{state}"
      action: set
  achievement_shipping_mission_changed_state:
    pv_mission_shipping_status:
      string: "{state}"
      action: set
  achievement_classic_multiball_jackpot_changed_state:
    pv_multiball_jackpot_status:
      string: "{state}"
      action: set
  achievement_video_mode_splash_changed_state:
    pv_video_mode_splash_status:
      string: "{state}"
      action: set
