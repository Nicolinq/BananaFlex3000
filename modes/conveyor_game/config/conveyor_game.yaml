slide_player:
  conveyor_game_mission_started:
    conveyor_game:
      action: play
      priority: 300
  conveyor_game_mission_completed:
    conveyor_game:
      action: remove
  conveyor_game_mission_failed:
    conveyor_game:
      action: remove
