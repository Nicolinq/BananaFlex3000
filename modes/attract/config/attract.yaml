#config_version=6
mode_settings:
  selectable_items:
    - title
    - credits
    - last_scores_1p{machine.player1_score and not machine.player2_score}
    - last_scores_2p{machine.player2_score and not machine.player3_score}
    - last_scores_3p{machine.player3_score and not machine.player4_score}
    - last_scores_4p{machine.player4_score}
    - mpf_logo
  next_item_events: s_flipper_left_button_active, timer_tim_attract_carousel_timer_complete
  previous_item_events: s_flipper_right_button_active

slide_player:
  mode_attract_started: attract


sound_player:
# play music each time the timer ends
  timer_tim_attract_music_complete: 
    Monkey_Business_Bumper:
      bus:  music
# Stop when attract mode ends
  mode_attract_stopped:
    Monkey_Business_Bumper:
      action: stop

show_player:
  mode_attract_started:
    attract_display_loop:
      speed: 50
    attract_display_inserts:
      speed: 50

timers:
  # Carousel auto update
  tim_attract_carousel_timer:
    end_value: 1
    tick_interval: 5s
    start_running: true
    control_events:
      - event: carousel_item_highlighted
        action: restart
      - event: flipper_cradle
        action: stop
      - event: flipper_cradle_release
        action: restart
  # To play the attract mode music
  tim_attract_music:
    start_value: 150
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: true
    restart_on_complete: true